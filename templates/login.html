<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Cadastro | Guia Turístico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="pagina-login">
        <div class="caixa-login">

            <h1>Criar conta</h1>

            <!-- Formulário de cadastro -->
            <form id="form-cadastro" action="{{ url_for('cadastrar_usuario') }}" method="POST">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" minlength="8" required>

                <button type="submit">Cadastrar</button>

            </form>

            <h2>Entrar na conta</h2>

            <!-- Formulário de login -->
            <form id="form-login" action="{{ url_for('entrar') }}" method="POST">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label for="email-login">E-mail</label>
                <input type="email" id="email-login" name="email" required>

                <label for="senha-login">Senha</label>
                <input type="password" id="senha-login" name="senha" required>

                <button type="submit">Entrar</button>

            </form>

        </div>
    </main>
</body>

</html>
