<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pontos | Guia Turístico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/leaflet.css') }}">
</head>

<body>
    <main>
        <h1>Meus Pontos Turísticos</h1>
        <p>Aqui você poderá cadastrar e acompanhar seus pontos turísticos.</p>

        <h2>Cadastrar novo ponto turístico</h2>

        <form id="form-ponto" action="{{ url_for('cadastrar_ponto') }}" method="POST">
            <label for="nome">Nome do local</label>
            <input type="text" id="nome" name="nome" required>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" required></textarea>

            <label for="estado-ponto">Estado</label>
            <select id="estado-ponto" name="uf" required>
                <option value="">Selecione um estado</option>
            </select>

            <label for="cidade-ponto">Cidade</label>
            <select id="cidade-ponto" name="codigo_ibge" required disabled>
                <option value="">Selecione uma cidade</option>
            </select>

            <input type="hidden" id="nome-cidade" name="cidade">

            <label>Localização do ponto turístico</label>
            <p>Clique no mapa para selecionar o local.</p>

            <div id="mapa-ponto"></div>

            <input type="hidden" id="latitude" name="latitude">
            <input type="hidden" id="longitude" name="longitude">

            <p id="coordenadas">
                Nenhuma localização selecionada.
            </p>

            <button type="submit">Enviar para aprovação</button>
        </form>

        <a href="/">Voltar ao início</a>
    </main>



    <script src="{{ url_for('static', filename='js/leaflet.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pontos.js') }}"></script>
</body>

</html>
